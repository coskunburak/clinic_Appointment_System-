spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:clinic_db}
    username: ${POSTGRES_USER:clinic_user}
    password: ${POSTGRES_PASSWORD:clinic_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.clinic: DEBUG
    org.flywaydb: INFO

clinic:
  demo:
    seed:
      enabled: true
    reset:
      enabled: false
      reseed: true
    credentials:
      admin-password: ${DEMO_ADMIN_PASSWORD:Admin123!}
      doctor-password: ${DEMO_DOCTOR_PASSWORD:Doctor123!}
      patient-password: ${DEMO_PATIENT_PASSWORD:Patient123!}
