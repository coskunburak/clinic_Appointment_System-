<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Sistem Hatası | Klinik Randevu Sistemi</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/clinic.css}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center bg-light">
    <main class="container text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="clinic-card p-5 text-center shadow">
                    <div class="mb-4 text-danger" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M4.54.146A.5.5 0 0 1 4.893 0h6.214a.5.5 0 0 1 .353.146l4.394 4.394a.5.5 0 0 1 .146.353v6.214a.5.5 0 0 1-.146.353l-4.394 4.394a.5.5 0 0 1-.353.146H4.893a.5.5 0 0 1-.353-.146L.146 11.46A.5.5 0 0 1 0 11.107V4.893a.5.5 0 0 1 .146-.353L4.54.146zM5.1 1 1 5.1v5.8L5.1 15h5.8l4.1-4.1V5.1L10.9 1H5.1z"/>
                            <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
                        </svg>
                    </div>
                    <h1 class="h3 fw-bold text-dark mb-3" th:text="${errorTitle ?: '500 — Beklenmeyen Sistem Hatası'}">500 — Beklenmeyen Sistem Hatası</h1>
                    <p class="text-muted mb-4 lead fs-6" th:text="${errorMessage ?: 'İşleminiz gerçekleştirilirken beklenmeyen bir teknik hata meydana geldi. Güvenliğiniz için teknik detaylar sınırlandırılmıştır. Lütfen daha sonra tekrar deneyiniz.'}">
                        İşleminiz gerçekleştirilirken beklenmeyen bir teknik hata meydana geldi. Güvenliğiniz için teknik detaylar sınırlandırılmıştır. Lütfen daha sonra tekrar deneyiniz.
                    </p>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a th:href="@{/}" class="btn btn-clinic-primary px-4">Ana Sayfaya Dön</a>
                        <a th:href="@{/login}" class="btn btn-outline-secondary px-4">Giriş Ekranı</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
