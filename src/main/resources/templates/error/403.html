<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Yetkisiz Erişim | Klinik Randevu Sistemi</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/clinic.css}">
</head>
<body class="error-page">
    <main class="error-layout">
        <div class="login-identity mb-4">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
            Klinik Randevu Sistemi
        </div>
        <section class="error-panel">
            <div class="error-code">İşlem durumu · 403</div>
            <h1 class="h3 fw-bold text-dark mb-3" th:text="${errorTitle ?: '403 — Yetkisiz Erişim'}">403 — Yetkisiz Erişim</h1>
            <p class="text-muted mb-4 lead fs-6" th:text="${errorMessage ?: 'Bu işlem için yetkiniz bulunmamaktadır.'}">Bu işlem için yetkiniz bulunmamaktadır.</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-start">
                <a th:href="@{/}" class="btn btn-clinic-primary px-4">Ana Sayfaya Dön</a>
                <a th:href="@{/login}" class="btn btn-outline-secondary px-4">Giriş Ekranı</a>
            </div>
        </section>
    </main>
</body>
</html>
