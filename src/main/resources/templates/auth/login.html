<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap — Klinik Randevu Sistemi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="login-container">
        <h2>Klinik Randevu Sistemi</h2>
        <h3>Giriş Yap</h3>

        <div th:if="${errorMessage}" class="alert alert-danger" style="color: red;">
            <p th:text="${errorMessage}"></p>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success" style="color: green;">
            <p th:text="${logoutMessage}"></p>
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <label for="email">E-posta Adresi:</label>
                <input type="email" id="email" name="email" required autocomplete="username" />
            </div>
            <div style="margin-top: 10px;">
                <label for="password">Şifre:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" />
            </div>
            <div style="margin-top: 15px;">
                <button type="submit" id="login-button">Giriş Yap</button>
            </div>
        </form>
    </div>
</body>
</html>
