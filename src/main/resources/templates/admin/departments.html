<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr"
      th:replace="~{fragments/layout :: mainLayout(~{::title}, ~{::section})}">
<head>
    <title>Tıbbi Bölümler — Klinik Randevu Sistemi</title>
</head>
<body>
<section>
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h3 fw-bold text-dark mb-1">Tıbbi Bölüm Yönetimi</h1>
            <p class="text-muted mb-0">Şubelerinize bağlı tıbbi poliklinik ve uzmanlık birimlerini (Kardiyoloji, Nöroloji vb.) yönetin.</p>
        </div>
    </div>

    <!-- Şube Filtreleme Seçicisi -->
    <div class="clinic-card py-3 px-4 mb-4">
        <form th:action="@{/admin/departments}" method="get" class="row align-items-center g-3">
            <div class="col-auto">
                <label for="filterBranchId" class="form-label fw-bold mb-0">Şube Filtresi:</label>
            </div>
            <div class="col-md-4">
                <select id="filterBranchId" name="branchId" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == selectedBranchId}">Merkez Şube</option>
                </select>
            </div>
        </form>
    </div>

    <div class="row g-4">
        <!-- Sol Kolon: Bölümler Listesi -->
        <div class="col-lg-8">
            <div class="clinic-card">
                <div class="clinic-card-header">
                    <h2 class="clinic-card-title">Kayıtlı Tıbbi Bölümler</h2>
                    <span class="badge bg-primary rounded-pill" th:text="${#lists.size(departments)} + ' Bölüm'">0 Bölüm</span>
                </div>

                <div th:if="${#lists.isEmpty(departments)}" class="text-center py-4 text-muted">
                    <p class="mb-0">Seçilen şubede henüz kayıtlı bir tıbbi bölüm bulunmamaktadır.</p>
                </div>

                <div th:if="${not #lists.isEmpty(departments)}" class="table-responsive">
                    <table class="clinic-table">
                        <thead>
                            <tr>
                                <th>Bölüm Adı</th>
                                <th>Durum</th>
                                <th>Kayıt Tarihi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${departments}">
                                <td class="fw-bold" th:text="${d.name}">Kardiyoloji</td>
                                <td>
                                    <span th:if="${d.active}" class="badge bg-success">Aktif</span>
                                    <span th:unless="${d.active}" class="badge bg-secondary">Pasif</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(d.createdAt, 'yyyy-MM-dd HH:mm')}">2026-11-01</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Sağ Kolon: Yeni Bölüm Ekleme Formu -->
        <div class="col-lg-4">
            <div class="clinic-card">
                <h2 class="clinic-card-title mb-3">Yeni Bölüm Tanımla</h2>

                <form th:action="@{/admin/departments}" th:object="${departmentForm}" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}" />

                    <div class="mb-3">
                        <label for="branchId" class="form-label small">Hedef Şube <span class="text-danger">*</span></label>
                        <select id="branchId" th:field="*{branchId}" class="form-select form-select-sm" required>
                            <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}">Merkez Şube</option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('branchId')}" th:errors="*{branchId}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label small">Bölüm Adı <span class="text-danger">*</span></label>
                        <input type="text" id="name" th:field="*{name}" class="form-control form-control-sm" required placeholder="Örn: Kardiyoloji, Göz Hastalıkları" />
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-clinic-primary btn-sm py-2">Bölümü Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
