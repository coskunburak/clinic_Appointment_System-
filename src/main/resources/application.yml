spring:
  application:
    name: clinic-appointment
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

clinic:
  demo:
    seed:
      enabled: false
    reset:
      enabled: false
      reseed: false
