  <text x="355" y="103" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">- interval: TimeInterval</text>
  <text x="355" y="118" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">- serviceSnapshot: ServiceSnapshot</text>
  <text x="355" y="133" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">- status: AppointmentStatus</text>
  <text x="355" y="148" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">+ create(...), reconstitute(...)</text>
  <text x="355" y="163" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">+ approve(actorId, clock)</text>
  <text x="355" y="178" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">+ reject(actorId, reason, clock)</text>
  <text x="355" y="193" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">+ cancel(actorId, reason, clock)</text>
  <text x="355" y="208" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="10.0" fill="#1e293b">+ complete(actorId, clock)</text>
